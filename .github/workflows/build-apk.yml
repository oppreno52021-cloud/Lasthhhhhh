name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npm run build
          mkdir -p www && cp -r dist/* www/ || true

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/build.gradle" ]; then
            echo "Android Gradle project missing or empty, removing incomplete android directory..."
            rm -rf android
            echo "Adding fresh Android platform via Capacitor CLI..."
            ./node_modules/.bin/cap add android
          fi
          echo "Syncing Capacitor Android..."
          ./node_modules/.bin/cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Configure Keystore from CI Secrets (if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "RELEASE_KEYSTORE_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "RELEASE_KEYSTORE_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Ensure Gradlew Executable
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing in android/, generating wrapper..."
            cd android && gradle wrapper || true
            cd ..
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          CMD="./gradlew"
          if [ ! -f "$CMD" ]; then
            CMD="gradle"
          fi
          if [ "$RELEASE_KEYSTORE_CONFIGURED" = "true" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            $CMD assembleRelease --no-daemon --stacktrace
          else
            $CMD assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masrofy-Android-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
